name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: maszinero_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/maszinero_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/maszinero_test
      SESSION_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
      DEMO_PASSWORD: demo12345
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run lint
      - run: npm run typecheck
      - name: Testy jednostkowe i licytacji na bazie
        run: npm test
      - run: npx next build
      - name: Dane demo
        run: npm run db:seed
      - run: npx playwright install --with-deps chromium
      - name: Testy end-to-end
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
